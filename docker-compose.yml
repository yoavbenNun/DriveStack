services:
  cpp-server:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - ./cpp_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 2s
      timeout: 2s
      retries: 30


  mongodb:
    image: mongo:latest
    container_name: drive_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-server:
    build: ./node-server
    ports:
      - "3000:3000"
    volumes:
      - ./node-server:/app
      - /app/node_modules  
    environment:
      - CPP_HOST=cpp-server
      - CPP_PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/drive_db
    depends_on:
      cpp-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30

  client:
    build: ./client
    ports:
      - "80:5173"  
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - node-server


volumes:
  mongo_data:    